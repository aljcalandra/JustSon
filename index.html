<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore deeply nested JSON, YAML and XML and compare documents. Runs entirely in your browser." />
    <title>JustSon</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='2' y='24' font-size='22' font-family='monospace' font-weight='700' fill='%232563eb'>{}</text></svg>" />
  </head>
  <body>
    <header class="top">
      <span class="brand">JustSon</span>
      <div class="tabs" role="tablist">
        <button role="tab" data-mode="explore">Explore</button>
        <button role="tab" data-mode="compare">Compare</button>
      </div>
      <div class="view-switch" role="radiogroup" aria-label="Explore view">
        <button role="radio" data-view="diagram" title="Diagram: linked cards">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="6" height="5" rx="1" /><rect x="9" y="9" width="6" height="5" rx="1" /><path d="M7 4.5h2.5a1 1 0 0 1 1 1V9" /></svg>
          Diagram
        </button>
        <button role="radio" data-view="list" title="List: indented tree">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M5 6.5h9M5 10h9M2 13.5h12" /></svg>
          List
        </button>
      </div>
    </header>
    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main"></main>
    </div>
    <div id="toast" class="toasts"></div>
    <div class="drop-overlay" aria-hidden="true">Drop JSON, YAML or XML files to open them</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
